<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production AI Patterns</title>
  <style>
    /* ── Theme variables ─────────────────────────────────────────── */
    :root {
      --color-bg:        #FAF9F6;
      --color-surface:   #FFFFFF;
      --color-text:      #1C1917;
      --color-text-2:    #57534E;
      --color-text-3:    #A8A29E;
      --color-accent:    #1E3A5F;
      --color-accent-lt: #E8EDF3;
      --color-border:    #E7E5E4;
      --color-tag-bg:    #F5F5F4;
      --color-tag-text:  #57534E;
      --color-pin-bg:    #FFFBEB;
      --color-pin-bdr:   #FDE68A;
      --color-pin-accent:#92400E;

      --font-body:    Georgia, 'Times New Roman', Times, serif;
      --font-heading: Georgia, 'Times New Roman', Times, serif;
      --font-mono:    'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', 'Courier New', monospace;

      --space-xs:  0.25rem;
      --space-sm:  0.5rem;
      --space-md:  1rem;
      --space-lg:  1.5rem;
      --space-xl:  2rem;
      --space-2xl: 3rem;
      --space-3xl: 4.5rem;

      --max-w:  720px;
      --radius: 5px;
    }

    /* ── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-lg) var(--space-xl);
    }
    .site-title {
      font-family: var(--font-heading);
      font-size: 2.05rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.18;
    }
    .site-tagline {
      font-size: 1.08rem;
      color: var(--color-text-2);
      margin-top: var(--space-sm);
      line-height: 1.55;
      font-style: italic;
    }
    .audience-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-3);
      margin-top: var(--space-md);
      padding: 0.15rem 0.55rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }

    /* ── Rule ────────────────────────────────────────────────────── */
    .rule {
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
      padding: 0 var(--space-lg);
    }
    .rule hr { border: none; border-top: 1px solid var(--color-border); }

    /* ── Main ────────────────────────────────────────────────────── */
    main {
      flex: 1;
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg);
    }

    /* ── Section label ───────────────────────────────────────────── */
    .sec-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-3);
      margin-bottom: var(--space-md);
    }

    /* ── Pinned section ──────────────────────────────────────────── */
    .pinned-section { margin-bottom: var(--space-2xl); }

    /* ── Feed ────────────────────────────────────────────────────── */
    .feed { margin-bottom: var(--space-xl); }

    /* ── Card ────────────────────────────────────────────────────── */
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: var(--space-lg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      margin-bottom: var(--space-lg);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      border-color: var(--color-accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .card--pinned {
      background: var(--color-pin-bg);
      border-color: var(--color-pin-bdr);
    }
    .card--pinned:hover {
      border-color: var(--color-pin-accent);
      box-shadow: 0 1px 6px rgba(146,64,14,0.08);
    }
    .card__marker {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-pin-accent);
      margin-bottom: var(--space-xs);
    }
    .card__title {
      font-family: var(--font-heading);
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: var(--space-sm);
    }
    .card__hook {
      font-size: 0.94rem;
      color: var(--color-text-2);
      line-height: 1.62;
      margin-bottom: var(--space-md);
    }
    .card__meta {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      flex-wrap: wrap;
      margin-bottom: var(--space-sm);
    }
    .card__date,
    .card__rt {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--color-text-3);
      letter-spacing: 0.02em;
    }
    .card__tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
    }
    .tag {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      padding: 0.12rem 0.45rem;
      background: var(--color-tag-bg);
      color: var(--color-tag-text);
      border-radius: 3px;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* ── Filter bar ──────────────────────────────────────────────── */
    .filter-bar {
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-lg);
      border-bottom: 1px solid var(--color-border);
    }
    .filter-bar__label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-3);
      display: block;
      margin-bottom: var(--space-sm);
    }
    .filter-bar__tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .ftag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.22rem 0.6rem;
      background: var(--color-tag-bg);
      color: var(--color-tag-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      letter-spacing: 0.02em;
    }
    .ftag:hover { border-color: var(--color-accent); }
    .ftag--on {
      background: var(--color-accent);
      color: #fff;
      border-color: var(--color-accent);
    }

    /* ── Empty state ─────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: var(--space-3xl) var(--space-lg);
    }
    .empty__glyph {
      font-family: var(--font-mono);
      font-size: 2.6rem;
      color: var(--color-border);
      margin-bottom: var(--space-md);
      line-height: 1;
    }
    .empty__text {
      font-size: 1.02rem;
      color: var(--color-text-3);
      font-style: italic;
    }

    /* ── Loading ─────────────────────────────────────────────────── */
    .loading {
      text-align: center;
      padding: var(--space-3xl);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--color-text-3);
      letter-spacing: 0.06em;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    footer {
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg) var(--space-2xl);
      border-top: 1px solid var(--color-border);
    }
    .footer__link {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--color-accent);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .footer__link:hover { text-decoration: underline; }
    .footer__desc {
      font-size: 0.86rem;
      color: var(--color-text-3);
      margin-top: var(--space-sm);
      line-height: 1.55;
    }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .site-title { font-size: 1.55rem; }
      .site-tagline { font-size: 0.96rem; }
      .card { padding: var(--space-md); }
      .card__title { font-size: 1.08rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="site-title" id="site-title"></h1>
    <p  class="site-tagline" id="site-tagline"></p>
    <span class="audience-pill" id="audience-pill"></span>
  </header>

  <div class="rule"><hr></div>

  <main id="main">
    <div class="loading">loading&hellip;</div>
  </main>

  <footer id="footer"></footer>

  <script>
  (async function () {
    /* ── helpers ──────────────────────────────────────────────── */
    function fmtDate (iso) {
      var d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function cardHTML (a, pinned) {
      var cls  = 'card' + (pinned ? ' card--pinned' : '');
      var tags = (a.tags || []).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('');
      var data = (a.tags || []).join(',');
      var marker = pinned ? '<div class="card__marker">§ pinned</div>' : '';
      return '<a class="' + cls + '" href="' + a.path + '" data-tags="' + data + '">' +
        marker +
        '<h2 class="card__title">' + a.title + '</h2>' +
        '<p class="card__hook">' + a.hook + '</p>' +
        '<div class="card__meta">' +
          '<span class="card__date">' + fmtDate(a.date) + '</span>' +
          '<span class="card__rt">' + a.reading_time_minutes + ' min read</span>' +
        '</div>' +
        '<div class="card__tags">' + tags + '</div>' +
      '</a>';
    }

    /* ── fetch metadata ───────────────────────────────────────── */
    var data, site, articles;
    try {
      var res = await fetch('./metadata.json');
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
      site     = data.site;
      articles = data.articles || [];
    } catch (e) {
      document.getElementById('main').innerHTML =
        '<div class="empty"><div class="empty__glyph">!</div><p class="empty__text">Could not load content.</p></div>';
      return;
    }

    /* ── populate header ──────────────────────────────────────── */
    document.getElementById('site-title').textContent   = site.title;
    document.getElementById('site-tagline').textContent  = site.tagline;
    document.getElementById('audience-pill').textContent = site.audience;
    document.title = site.title;

    /* ── populate footer ──────────────────────────────────────── */
    document.getElementById('footer').innerHTML =
      '<a class="footer__link" href="' + site.base_url + '">' + site.base_url + '</a>' +
      '<p class="footer__desc">' + site.description + '</p>';

    /* ── filter & sort ────────────────────────────────────────── */
    var published = articles.filter(function (a) { return a.status === 'published'; });

    var pinned   = published.filter(function (a) { return a.pinned === true; });
    var unpinned = published.filter(function (a) { return !a.pinned; });
    unpinned.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

    var main = document.getElementById('main');

    /* ── empty state ──────────────────────────────────────────── */
    if (published.length === 0) {
      main.innerHTML =
        '<div class="empty">' +
          '<div class="empty__glyph">&sect;</div>' +
          '<p class="empty__text">The first piece is coming.</p>' +
        '</div>';
      return;
    }

    /* ── tag filter (only if >6 articles) ─────────────────────── */
    var allTags   = [];
    var tagSet    = {};
    published.forEach(function (a) {
      (a.tags || []).forEach(function (t) { tagSet[t] = true; });
    });
    allTags = Object.keys(tagSet).sort();

    var showFilter = published.length > 6 && allTags.length > 0;

    var html = '';

    if (showFilter) {
      html += '<nav class="filter-bar" id="filter-bar">' +
        '<span class="filter-bar__label">Filter by tag</span>' +
        '<div class="filter-bar__tags" id="filter-tags">' +
          '<button class="ftag ftag--on" data-tag="">all</button>';
      allTags.forEach(function (t) {
        html += '<button class="ftag" data-tag="' + t + '">' + t + '</button>';
      });
      html += '</div></nav>';
    }

    /* ── pinned ───────────────────────────────────────────────── */
    if (pinned.length > 0) {
      html += '<section class="pinned-section">' +
        '<div class="sec-label">Start here</div>';
      pinned.forEach(function (a) { html += cardHTML(a, true); });
      html += '</section>';
    }

    /* ── feed ─────────────────────────────────────────────────── */
    html += '<section class="feed" id="feed">' +
      '<div class="sec-label">Articles</div>';
    unpinned.forEach(function (a) { html += cardHTML(a, false); });
    html += '</section>';

    main.innerHTML = html;

    /* ── wire filter ──────────────────────────────────────────── */
    if (showFilter) {
      var bar = document.getElementById('filter-bar');
      bar.addEventListener('click', function (e) {
        var btn = e.target;
        if (!btn.classList.contains('ftag')) return;
        var tag = btn.getAttribute('data-tag');

        bar.querySelectorAll('.ftag').forEach(function (b) {
          b.classList.toggle('ftag--on', b.getAttribute('data-tag') === tag);
        });

        var feed = document.getElementById('feed');
        feed.querySelectorAll('.card').forEach(function (c) {
          if (!tag) { c.style.display = ''; return; }
          var ct = (c.getAttribute('data-tags') || '').split(',');
          c.style.display = ct.indexOf(tag) !== -1 ? '' : 'none';
        });
      });
    }
  })();
  </script>

</body>
</html>
